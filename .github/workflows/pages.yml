name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
    # crew.json/character/** update on their own ~2min timer (vs-crew.timer) independent of
    # any real mod-list change. A GitHub Pages deployment auto-cancels whatever's still
    # pending the moment a newer commit lands (regardless of this workflow's own
    # concurrency:cancel-in-progress below, which only governs the Actions job queue, not the
    # Pages deployment resource) - at a 2min push cadence a deploy can never outrun the next
    # push, so every deployment gets cancelled before finishing and the published site gets
    # stuck indefinitely (this happened for real: three weeks stale, confirmed 0 successes in
    # the last 500 workflow runs, 2026-08-27). Real registry.json changes still trigger a
    # deploy immediately; a commit touching only these paths must not.
    paths-ignore:
      - 'crew.json'
      - 'character/**'
permissions:
  contents: read
  pages: write
  id-token: write
# Renamed from "pages" (2026-09-03): the old group name accumulated a massive backlog of
# never-dispatched runs during the 2026-08 crew-timer-spam era (thousands queued with
# cancel-in-progress:false, so none could ever cut in line to get a job). Even after the
# crew.json paths-ignore fix stopped new spam, every legitimate push since kept queueing
# behind that dead backlog and never got a job either - confirmed via the Actions API
# (0 jobs on every run since 2026-08-06, and 0 Pages deployment records created since then).
# A fresh group name sidesteps the backlog outright. cancel-in-progress is now true so a
# single wedged run (which can still happen - see the diagnostic-commit incident,
# 2026-08-26/27) can't deadlock the whole pipeline for weeks again; the tradeoff (a later
# push cancelling an earlier still-in-flight deploy) is fine now that paths-ignore keeps
# push frequency low.
concurrency:
  group: pages-deploy-v2
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
